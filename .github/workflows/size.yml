name: Size
on: [pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm

      # size-limit writes the results array and then exits 1 in two cases:
      # an entry is over its limit, or an entry's path matches no file. For
      # an entry over its limit, the render step is the gate: it writes the
      # report first and then fails, so the comment step can still post it.
      # An entry whose path matches no file still reads "passed": true, but
      # it has a negative size and no "sizeLimit" (every entry here sets a
      # limit), so this step fails on it, even next to an entry over its
      # limit. A crash writes `{"error": ...}` instead of the results array
      # and fails here too.
      - name: Measure PR bundle sizes
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsdown
          status=0
          pnpm exec size-limit --json > /tmp/size-pr.json || status=$?
          if ! jq -e 'type == "array"' /tmp/size-pr.json > /dev/null; then
            cat /tmp/size-pr.json
            exit 1
          fi
          if jq -e 'any(.[]; .size < 0 or (has("sizeLimit") | not))' /tmp/size-pr.json > /dev/null; then
            cat /tmp/size-pr.json
            echo "::error::A size-limit path matches no file. Check the size-limit config against the build output."
            exit 1
          fi
          if [ "$status" -ne 0 ] && ! jq -e 'any(.[]; .passed == false)' /tmp/size-pr.json > /dev/null; then
            cat /tmp/size-pr.json
            echo "::error::size-limit exited $status with no entry over its limit."
            exit 1
          fi

      - name: Measure base branch bundle sizes
        # Best-effort: if the base branch fails to build or measure, the
        # report degrades to PR-only sizes instead of failing the job.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add /tmp/base-checkout "$BASE_SHA"
          cd /tmp/base-checkout
          if pnpm install --frozen-lockfile && pnpm exec tsdown; then
            # A base that is already over a limit still gives valid deltas.
            # A base path that matches no file does not (negative size, no
            # "sizeLimit"), even next to an entry over its limit, and neither
            # does any other failure, so drop the results in those cases.
            status=0
            pnpm exec size-limit --json > /tmp/size-base.json || status=$?
            if jq -e 'any(.[]; .size < 0 or (has("sizeLimit") | not))' /tmp/size-base.json > /dev/null 2>&1; then
              rm -f /tmp/size-base.json
            elif [ "$status" -ne 0 ] && ! jq -e 'any(.[]; .passed == false)' /tmp/size-base.json > /dev/null 2>&1; then
              rm -f /tmp/size-base.json
            fi
          fi
          if jq -e 'type == "array"' /tmp/size-base.json > /dev/null 2>&1; then
            echo "Base branch measured."
          else
            echo "::warning::Could not measure base branch; reporting PR sizes only."
            rm -f /tmp/size-base.json
          fi

      - name: Render size report (fails when limits are exceeded)
        run: |
          if [ -f /tmp/size-base.json ]; then
            node scripts/size-report.ts /tmp/size-pr.json /tmp/size-base.json > /tmp/size-report.md
          else
            node scripts/size-report.ts /tmp/size-pr.json > /tmp/size-report.md
          fi

      - name: Comment size report on PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readFileSync, existsSync } = require('node:fs');
            if (!existsSync('/tmp/size-report.md')) {
              return;
            }
            const body = readFileSync('/tmp/size-report.md', 'utf-8');
            const marker = '<!-- size-report -->';
            // Fork PRs get a read-only token: the report is still in the job
            // log, so a failed comment must not turn the job red.
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const existing = comments.find(
                c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              core.warning(`Could not post size report comment (fork PR?): ${err.message}`);
            }
