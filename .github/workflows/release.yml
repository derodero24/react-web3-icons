name: Release

on:
  push:
    branches: [develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: nothing is versioned or published from a commit that has not passed
  # lint, typecheck, tests (with coverage thresholds), build and size limits.
  # This also covers the version PR: GITHUB_TOKEN creates and updates it, so
  # its CI runs wait for a maintainer's approval (docs/releasing.md), and its
  # merge commit is verified here before `publish` runs either way.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test --coverage

      - name: Build
        run: pnpm run build

      - name: Size
        run: pnpm run size

  release:
    name: Version or publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # version branch, release tags, fast-forward of main
      pull-requests: write # version PR
      id-token: write # npm provenance attestation

    steps:
      # Nothing reads credentials from the checkout: changesets/action v2
      # takes the token only from its `github-token` input and, with
      # push-with-git-cli off, pushes through the GitHub API; the
      # fast-forward step below authenticates its own push.
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # registry-url writes an .npmrc (exported as NPM_CONFIG_USERCONFIG) that
      # reads the token from NODE_AUTH_TOKEN, which only the publish step sets.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Build here, without any credentials in the environment: the publish
      # step disables lifecycle scripts, so `prepublishOnly` does not rebuild.
      - name: Build
        run: pnpm run build

      # changesets/action takes its version path whenever unreleased
      # changesets exist and its publish path otherwise. Deciding that here
      # lets the two paths run as separate steps, so the npm token is only in
      # the environment of the step that actually publishes.
      - name: Detect pending changesets
        id: pending
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "changesets=false" >> "$GITHUB_OUTPUT"
          fi

      # Both changesets/action steps share these choices:
      # - github-token: v2 no longer reads GITHUB_TOKEN from the environment
      #   (and fails if it is set to anything else), so the token is passed
      #   here and these steps set no GITHUB_TOKEN env. The action itself
      #   exports it as GITHUB_TOKEN to the version / publish script
      #   (@changesets/changelog-github reads it to link PRs and authors).
      # - push-with-git-cli: false (the v2 default, set explicitly). The
      #   version commit and the release tags are created through the GitHub
      #   API, so the action needs no git credentials at all, and the version
      #   commit is signed by GitHub ("Verified"). That keeps a future
      #   "require signed commits" ruleset (#718) satisfiable on develop and
      #   on main, which only receives develop's commits by fast-forward.
      # - Tags are lightweight refs created through the API on the commit
      #   that triggered this run (the version PR merge), named
      #   `react-web3-icons@<version>` as before.

      # Version path: opens or updates the version PR. No npm credentials.
      # `version-packages` runs `changeset version`, then
      # scripts/sync-readme-version.ts, which sets README.md's CDN version
      # pins to the new version. The two commands live in a package.json
      # script because the action runs `version-script` through @actions/exec,
      # which splits the string into arguments and starts the first one
      # without a shell: a `&&` here would reach `changeset` as an argument.
      # `publish-script` is only metadata here: with pending changesets the
      # action runs `version-script` and uses the presence of a publish
      # script to word the PR body ("will be published automatically"); it
      # never executes it.
      - name: Create or update the version PR
        if: steps.pending.outputs.changesets == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run version-packages
          publish-script: pnpm changeset publish
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          push-with-git-cli: false

      # Publish path: only reached when no changeset is pending, i.e. after
      # the version PR was merged.
      # `pnpm changeset publish` (Changesets v3) spawns `pnpm publish --json
      # --access public --tag latest --no-git-checks` with the inherited
      # environment, and pnpm (which hands the upload to `npm publish`)
      # honours npm_config_ignore_scripts: no prepublishOnly / prepack /
      # prepare / publish / postpublish script runs with the token.
      # npm auth comes from setup-node's .npmrc via NODE_AUTH_TOKEN; v2 no
      # longer reads NPM_TOKEN or writes an .npmrc of its own.
      # The action detects what was published from the NDJSON file the CLI
      # writes to $CHANGESETS_OUTPUT (inherited through pnpm), then creates
      # the git tag and GitHub release for each published package.
      # create-github-releases needs push-git-tags (v2 fails the step if
      # releases are on and tags are off); both are the defaults, kept
      # explicit because v2 changed what they mean.
      - name: Publish
        id: changesets
        if: steps.pending.outputs.changesets == 'false'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm changeset publish
          push-with-git-cli: false
          push-git-tags: true
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          npm_config_ignore_scripts: 'true'

      # The action only writes the version branch, tags and releases; this
      # push to main is ours, so it brings its own (step-scoped) credentials.
      - name: Fast-forward main to develop
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main:main
          git checkout main
          if git merge develop --ff-only; then
            # Credentials for this push only: nothing is persisted by the
            # checkout or the changesets action. GIT_CONFIG_* keeps the
            # header out of argv and out of .git/config.
            auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            echo "::add-mask::${auth}"
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
              git push origin main
          else
            echo "::error::Fast-forward merge failed. main may have diverged from develop. Manual intervention required."
            exit 1
          fi
