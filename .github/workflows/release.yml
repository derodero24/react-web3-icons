name: Release

on:
  push:
    branches: [develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: nothing is versioned or published from a commit that has not passed
  # lint, typecheck, tests (with coverage thresholds), build and size limits.
  # This also covers the version PR, whose GITHUB_TOKEN-created commits do not
  # trigger CI: its merge commit is verified here before `publish` runs.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test --coverage

      - name: Build
        run: pnpm run build

      - name: Size
        run: pnpm run size

  release:
    name: Version or publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # version branch, release tags, fast-forward of main
      pull-requests: write # version PR
      id-token: write # npm provenance attestation

    steps:
      # changesets/action v1.9.0 does not use the checkout's credentials: on
      # start it writes ~/.netrc (login github-actions[bot], password = its
      # GITHUB_TOKEN) and pushes with plain `git push origin ...`, so nothing
      # needs to be persisted in .git/config.
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # registry-url writes an .npmrc (exported as NPM_CONFIG_USERCONFIG) that
      # reads the token from NODE_AUTH_TOKEN, which only the publish step sets.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Build here, without any credentials in the environment: the publish
      # step disables lifecycle scripts, so `prepublishOnly` does not rebuild.
      - name: Build
        run: pnpm run build

      # `pnpm changeset publish` spawns `pnpm publish --access public --tag
      # latest --no-git-checks --json` with the inherited environment, and
      # pnpm (which hands the upload to `npm publish`) honours
      # npm_config_ignore_scripts: no prepublishOnly / prepack / prepare /
      # publish / postpublish script runs with the token.
      # NPM_TOKEN is deliberately not set: the action would only copy it into
      # ~/.npmrc, which outlives this step, while setup-node's .npmrc already
      # authenticates through NODE_AUTH_TOKEN.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          npm_config_ignore_scripts: 'true'

      - name: Fast-forward main to develop
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main:main
          git checkout main
          if git merge develop --ff-only; then
            # Credentials for this push only, instead of relying on the
            # ~/.netrc the changesets action leaves behind. GIT_CONFIG_* keeps
            # the header out of argv and out of .git/config.
            auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            echo "::add-mask::${auth}"
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
              git push origin main
          else
            echo "::error::Fast-forward merge failed. main may have diverged from develop. Manual intervention required."
            exit 1
          fi
