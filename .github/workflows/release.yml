name: Release

on:
  push:
    branches: [develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Three jobs, so that no step that installs or builds the workspace holds a
# credential that can publish (docs/releasing.md, "Release flow"):
# - verify: lint, typecheck, tests, build and size limits, then `pnpm pack`.
#   Read-only, no secrets, no OIDC token.
# - version: while changesets are pending, opens or updates the version PR.
#   It can write to the repository but cannot publish.
# - publish: once the version PR is merged, uploads the tarball that verify
#   packed. It never installs or builds the workspace, so it is the only job
#   with `id-token: write`, which npm trusted publishing exchanges for a
#   short-lived publish token.
jobs:
  # Gate: nothing is versioned or published from a commit that has not passed
  # lint, typecheck, tests (with coverage thresholds), build and size limits.
  # This also covers the version PR: GITHUB_TOKEN creates and updates it, so
  # its CI runs wait for a maintainer's approval (docs/releasing.md), and its
  # merge commit is verified here before `publish` runs either way.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changesets: ${{ steps.pending.outputs.changesets }}
      version: ${{ steps.pack.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test --coverage

      - name: Build
        run: pnpm run build

      - name: Size
        run: pnpm run size

      # changesets/action takes its version path whenever unreleased
      # changesets exist and its publish path otherwise. Deciding that here
      # lets the two paths run as separate jobs with separate permissions.
      - name: Detect pending changesets
        id: pending
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "changesets=false" >> "$GITHUB_OUTPUT"
          fi

      # The tarball is packed from the build above (no package has a
      # `prepack` script), so `publish` uploads exactly what was verified.
      # The release notes are this version's section of CHANGELOG.md, as
      # changesets/action used to write them.
      - name: Pack the release
        id: pack
        if: steps.pending.outputs.changesets == 'false'
        run: |
          version="$(node -p 'require("./package.json").version')"
          mkdir release
          pnpm pack --pack-destination release
          mv "release/react-web3-icons-${version}.tgz" release/package.tgz
          awk -v heading="## ${version}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release/notes.md
          if ! grep -q '[^[:space:]]' release/notes.md; then
            echo "::error::CHANGELOG.md has no entry for ${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload the release
        if: steps.pending.outputs.changesets == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  # Version path: opens or updates the version PR. No npm credentials and no
  # OIDC token, so the install and the version script below cannot publish.
  version:
    name: Version PR
    needs: verify
    if: needs.verify.outputs.changesets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # version branch
      pull-requests: write # version PR

    steps:
      # Nothing reads credentials from the checkout: changesets/action v2
      # takes the token only from its `github-token` input and, with
      # push-with-git-cli off, pushes through the GitHub API.
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: pnpm

      # `changeset version` and @changesets/changelog-github need the
      # workspace's dependencies.
      - name: Install deps
        run: pnpm install --frozen-lockfile

      # - github-token: v2 no longer reads GITHUB_TOKEN from the environment
      #   (and fails if it is set to anything else), so the token is passed
      #   here. The action itself exports it as GITHUB_TOKEN to the version
      #   script (@changesets/changelog-github reads it to link PRs and
      #   authors).
      # - push-with-git-cli: false (the v2 default, set explicitly). The
      #   version commit is created through the GitHub API, so the action
      #   needs no git credentials, and the commit is signed by GitHub
      #   ("Verified"). That keeps a "require signed commits" ruleset (#718)
      #   satisfiable on develop and on main, which only receives develop's
      #   commits by fast-forward.
      # - `version-packages` runs `changeset version`, then
      #   scripts/sync-readme-version.ts, which sets every exact
      #   react-web3-icons@X.Y.Z in README.md (today, the CDN examples) and
      #   the major in its unpinned-URL example to the new version. The two
      #   commands live in a package.json script because the action runs
      #   `version-script` through @actions/exec, which splits the string
      #   into arguments and starts the first one without a shell: a `&&`
      #   here would reach `changeset` as an argument.
      # - `publish-script` is only metadata: with pending changesets the
      #   action runs `version-script` and uses the presence of a publish
      #   script to word the PR body ("will be published automatically"); it
      #   never executes it. The publish job below does the publishing.
      - name: Create or update the version PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run version-packages
          publish-script: pnpm changeset publish
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          push-with-git-cli: false

  # Publish path: reached when no changeset is pending, i.e. on the version
  # PR's merge commit and on every later push until the next changeset. A
  # version that is already on npm and already has its GitHub release is
  # left alone, so those later pushes do nothing here.
  publish:
    name: Publish
    needs: verify
    if: needs.verify.outputs.changesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # release tag, GitHub release, fast-forward of main
      id-token: write # npm trusted publishing and provenance attestation

    steps:
      # No checkout and no install: this job runs no code from the
      # repository or its dependencies, only npm, gh and git.
      - name: Download the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # Node 24 bundles npm 11.5.1 or later, which trusted publishing needs.
      # No registry-url: npm publishes to its default registry and gets its
      # credential through OIDC, so no .npmrc with a token is written. No
      # `cache: pnpm`: nothing is installed here.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      # Both checks tell "not there" (HTTP 404) from errors: anything else
      # but 200 (an outage, a rate limit, an auth problem) stops the job
      # rather than counting as not released.
      - name: Check what is already released
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          exists() {
            case "$2" in
              200) echo "$1=true" >> "$GITHUB_OUTPUT" ;;
              404) echo "$1=false" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::Checking $1 for react-web3-icons@${VERSION} answered HTTP $2."
                exit 1
                ;;
            esac
          }
          exists on-npm "$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/react-web3-icons/${VERSION}")"
          exists released "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/react-web3-icons@${VERSION}")"

      # npm runs no lifecycle script when it publishes a tarball, and
      # --ignore-scripts makes that explicit. The path starts with ./ because
      # npm reads `release/package.tgz` as the GitHub repository
      # release/package.tgz. --provenance attests the
      # tarball to this run and commit. npm authenticates through the
      # trusted publisher configured for release.yml on npmjs.com; there is
      # no npm token (docs/releasing.md).
      - name: Publish to npm
        if: steps.state.outputs.on-npm == 'false'
        run: npm publish ./release/package.tgz --provenance --access public --tag latest --ignore-scripts

      # The tag is a lightweight ref on the commit that triggered this run
      # (the version PR merge), created through the API together with the
      # release, named `react-web3-icons@<version>` as before.
      - name: Create the tag and GitHub release
        if: steps.state.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "react-web3-icons@${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "react-web3-icons@${VERSION}" \
            --notes-file release/notes.md

      # main follows develop to the release commit: the commit this
      # version's tag points at. On later pushes the tag points at an older
      # commit, so main stays where it is. Deciding by the tag rather than by
      # what this run published lets a re-run finish a fast-forward that
      # failed after the upload and the release.
      - name: Check the release commit
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/react-web3-icons@${VERSION}" --jq '"\(.object.type) \(.object.sha)"')"
          read -r type tagged <<< "$ref"
          # An annotated tag (as releases before 5.0.0 had) points at a tag
          # object, which in turn points at the commit.
          if [ "$type" = tag ]; then
            tagged="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tagged}" --jq .object.sha)"
          fi
          if [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "release-commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "release-commit=false" >> "$GITHUB_OUTPUT"
          fi

      # The checkout goes to its own directory, next to the downloaded
      # release, and nothing from it is run.
      - name: Checkout repo
        if: steps.tag.outputs.release-commit == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward main to the release commit
        if: steps.tag.outputs.release-commit == 'true'
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main:main
          if git merge-base --is-ancestor "$GITHUB_SHA" main; then
            echo "main already contains ${GITHUB_SHA}."
            exit 0
          fi
          git checkout main
          if git merge "$GITHUB_SHA" --ff-only; then
            # Credentials for this push only: nothing is persisted by the
            # checkout. GIT_CONFIG_* keeps the header out of argv and out of
            # .git/config.
            auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            echo "::add-mask::${auth}"
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
              git push origin main
          else
            echo "::error::Fast-forward merge failed. main may have diverged from develop. Manual intervention required."
            exit 1
          fi
