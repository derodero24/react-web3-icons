name: Visual Regression

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'icons/**'
      - 'scripts/normalize-viewbox.ts'
      - 'scripts/build-icons/optical*.ts'
      - 'test/visual/**'
      - 'scripts/build-icons/mono-audit.ts'
      - 'vitest.config.visual.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [develop]
    paths:
      - 'src/**'
      - 'icons/**'
      - 'scripts/normalize-viewbox.ts'
      - 'scripts/build-icons/optical*.ts'
      - 'test/visual/**'
      - 'scripts/build-icons/mono-audit.ts'
      - 'vitest.config.visual.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual-test:
    name: Visual regression test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # PRs labeled 'visual-baseline-update' intentionally change icon
      # rendering: they skip the comparison and only verify that every icon
      # still renders (the post-merge develop run rebuilds the cache).
      BASELINE_UPDATE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual-baseline-update') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so a missing baseline can be rendered from the PR's
          # base commit (git worktree below).
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm ls playwright --depth=0 --parseable --long | grep -oP 'playwright@\K[0-9.]+' | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Every icon source must sit on the 64-grid exactly as
      # scripts/normalize-viewbox.ts writes it (optical size, #704). The full
      # check renders every unit and takes minutes, so PRs check only the
      # units they touch; a unit is checked when its json or any of its SVGs
      # changed.
      - name: Check optical-size normalization of changed icons (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          units=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- 'icons/*/*.json' 'icons/*/*.svg' \
            | sed -E 's#^(icons/[^/]+/[^./]+)\..*$#\1.json#' | sort -u \
            | while read -r unit; do if [ -f "$unit" ]; then echo "$unit"; fi; done)
          if [ -z "$units" ]; then
            echo "No icon sources changed."
          else
            echo "$units"
            # shellcheck disable=SC2086 # one argument per unit
            node scripts/normalize-viewbox.ts --check $units
          fi

      # Reference screenshots live only in the Actions cache, keyed by the
      # develop commit that rendered them and the Playwright (Chromium)
      # version that rendered them. Lookups are exact: a prefix fallback
      # would silently compare against some other commit's rendering.

      # On develop: render and cache the reference screenshots for this commit
      - name: Restore reference screenshots (develop)
        if: github.event_name == 'push'
        id: screenshots-cache-develop
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/visual/__screenshots__
          key: visual-screenshots-develop-pw${{ steps.playwright-version.outputs.version }}-${{ github.sha }}

      - name: Generate reference screenshots (develop)
        if: github.event_name == 'push' && steps.screenshots-cache-develop.outputs.cache-hit != 'true'
        run: pnpm test:visual:update

      - name: Regenerate baselines (intentional visual change)
        if: env.BASELINE_UPDATE == 'true'
        run: pnpm test:visual:update

      # On PRs: the baseline must come from the base commit, never from this
      # PR's own rendering.
      - name: Restore reference screenshots for the base commit (PR)
        if: github.event_name == 'pull_request' && env.BASELINE_UPDATE != 'true'
        id: screenshots-cache-pr
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/visual/__screenshots__
          key: visual-screenshots-develop-pw${{ steps.playwright-version.outputs.version }}-${{ github.event.pull_request.base.sha }}

      - name: Render baseline from the base commit (PR, cache miss)
        if: github.event_name == 'pull_request' && env.BASELINE_UPDATE != 'true' && steps.screenshots-cache-pr.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_DIR: ${{ runner.temp }}/visual-base
        run: |
          echo "::notice::No cached baseline for base commit $BASE_SHA; rendering it from that commit."
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          (
            cd "$BASE_DIR"
            pnpm install --frozen-lockfile
            # The base may pin a different Playwright; install its Chromium.
            pnpm exec playwright install chromium
            pnpm test:visual:update
          )
          rm -rf test/visual/__screenshots__
          cp -R "$BASE_DIR/test/visual/__screenshots__" test/visual/__screenshots__
          git worktree remove --force "$BASE_DIR"

      - name: Generate screenshots for new icons (PR)
        if: github.event_name == 'pull_request' && env.BASELINE_UPDATE != 'true'
        run: |
          # Build to make the dist available for the node script
          pnpm build --silent
          # Icons without a base-commit screenshot are new in this PR. The
          # pattern is anchored to the full test name ("<describe> <icon>")
          # so a new `Base` does not re-baseline `Basescan*`.
          NEW_ICONS_PATTERN=$(node --input-type=module <<'EOF'
          import { existsSync } from 'node:fs';
          import * as icons from './dist/index.mjs';
          const fwdRef = Symbol.for('react.forward_ref');
          const dir = 'test/visual/__screenshots__/icons.test.tsx';
          const newIcons = Object.entries(icons)
            .filter(([, v]) => v?.$$typeof === fwdRef)
            .map(([name]) => name)
            .filter(name => !existsSync(`${dir}/${name}.png`));
          if (newIcons.length > 0) {
            const escaped = newIcons.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            process.stdout.write(`^Icon visual regression (${escaped.join('|')})$`);
          }
          EOF
          )
          if [ -n "$NEW_ICONS_PATTERN" ]; then
            echo "::notice::Generating reference screenshots for new icons: $NEW_ICONS_PATTERN"
            pnpm test:visual:update -t "$NEW_ICONS_PATTERN"
          fi

      - name: Run visual regression tests
        if: github.event_name == 'pull_request' && env.BASELINE_UPDATE != 'true'
        run: pnpm test:visual

      # toMatchScreenshot writes the -actual and -diff images of a mismatch
      # to the attachments directory, not next to the references:
      # .vitest-attachments/ under vitest 4, .vitest/attachments/ under
      # vitest 5. Both are dot-directories, which upload-artifact skips
      # unless include-hidden-files is set. The directory the installed
      # vitest does not use is simply absent from the artifact.
      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diffs
          path: |
            test/visual/__screenshots__
            .vitest-attachments
            .vitest/attachments
          include-hidden-files: true
          retention-days: 30
