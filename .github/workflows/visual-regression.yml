name: Visual Regression

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'test/visual/**'
      - 'vitest.config.visual.ts'
  pull_request:
    branches: [develop]
    paths:
      - 'src/**'
      - 'test/visual/**'
      - 'vitest.config.visual.ts'

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual-test:
    name: Visual regression test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm ls playwright --depth=0 --parseable --long | grep -oP 'playwright@\K[0-9.]+' | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # On develop: generate and cache reference screenshots
      - name: Restore reference screenshots (develop)
        if: github.event_name == 'push'
        id: screenshots-cache-develop
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: test/visual/__screenshots__
          key: visual-screenshots-develop-${{ github.sha }}
          restore-keys: |
            visual-screenshots-develop-

      - name: Generate reference screenshots (develop)
        if: github.event_name == 'push' && steps.screenshots-cache-develop.outputs.cache-hit != 'true'
        run: pnpm test:visual:update

      # PRs labeled 'visual-baseline-update' intentionally change icon
      # rendering: skip the develop-baseline comparison and only verify that
      # every icon still renders (fresh baselines are generated from this
      # branch; the post-merge develop run rebuilds the cache).
      - name: Regenerate baselines (intentional visual change)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual-baseline-update')
        run: pnpm test:visual:update

      # On PRs: restore develop baseline and compare
      - name: Restore reference screenshots from develop (PR)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'visual-baseline-update')
        id: screenshots-cache-pr
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: test/visual/__screenshots__
          key: visual-screenshots-develop-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            visual-screenshots-develop-

      - name: Check for existing screenshots (PR)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'visual-baseline-update')
        id: check-screenshots
        run: |
          if [ -d "test/visual/__screenshots__" ] && [ -n "$(ls -A test/visual/__screenshots__ 2>/dev/null)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate baseline if none cached (PR)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'visual-baseline-update') && steps.check-screenshots.outputs.exists != 'true'
        run: |
          echo "::warning::No reference screenshots from develop found. Generating baseline for this run."
          pnpm test:visual:update

      - name: Generate screenshots for new icons (PR)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'visual-baseline-update') && steps.check-screenshots.outputs.exists == 'true'
        run: |
          # Build to make the dist available for the node script
          pnpm build --silent
          # Find icons that don't have a reference screenshot yet (newly added in this PR)
          NEW_ICONS=$(node --input-type=module <<'EOF'
          import { existsSync } from 'node:fs';
          import * as icons from './dist/index.mjs';
          const fwdRef = Symbol.for('react.forward_ref');
          const dir = 'test/visual/__screenshots__/icons.test.tsx';
          const newIcons = Object.entries(icons)
            .filter(([, v]) => v?.$$typeof === fwdRef)
            .map(([name]) => name)
            .filter(name => !existsSync(`${dir}/${name}.png`));
          if (newIcons.length > 0) {
            process.stdout.write(newIcons.join('|'));
          }
          EOF
          )
          if [ -n "$NEW_ICONS" ]; then
            echo "::notice::Generating reference screenshots for new icons: $NEW_ICONS"
            pnpm test:visual:update -t "$NEW_ICONS"
          fi

      - name: Run visual regression tests
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'visual-baseline-update')
        run: pnpm test:visual

      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-diffs
          path: test/visual/__screenshots__
          retention-days: 30
