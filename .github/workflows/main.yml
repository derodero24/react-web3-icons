name: CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Replaces the former `pnpm audit` job: the npm registry retired the audit
  # endpoints it relied on (HTTP 410, see #695). Dependency review checks the
  # dependency diff of each PR against the GitHub Advisory Database; existing
  # dependencies are covered by Dependabot alerts, weekly CodeQL, and pnpm's
  # minimumReleaseAge.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build:
    name: Build, lint, and test on Node ${{ matrix.node }}

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test -- --coverage

      - name: Build
        run: pnpm run build

  build-example:
    name: Build example app
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Intentionally no library build: Vercel deploys the example with only
      # `next build` (see example/vercel.json), resolving the workspace
      # package from source via next.config/tsconfig aliases. Building dist
      # here would mask missing-alias failures that then break deploys.
      - name: Build example app
        run: pnpm --filter react-web3-icons-example run build

  package-checks:
    name: Package validation (publint, attw)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build

      - name: publint
        run: pnpm dlx publint --strict

      - name: Are the types wrong
        run: pnpm dlx @arethetypeswrong/cli --pack . --profile esm-only
