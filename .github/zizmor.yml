# zizmor configuration — https://docs.zizmor.sh/configuration/
rules:
  unpinned-uses:
    config:
      policies:
        # Every action must be pinned to a full commit SHA. Renovate's
        # pinGitHubActionDigestsToSemver preset (renovate.json) keeps the
        # digests fresh and the trailing `# vX.Y.Z` comments exact, which the
        # online `ref-version-mismatch` audit checks.
        '*': hash-pin
